name: CI

on:
  pull_request:
  push:
    branches: [main, "dev/**"]

jobs:
  check:
    name: Type-check, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint
        continue-on-error: true

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api-dev.tncpharmacy.com/api
          NEXT_PUBLIC_MEDIA_BASE_URL: https://storage.googleapis.com/tnc-pharmacy-product-images-bucket-dev/
          NEXT_PUBLIC_PRESCRIPTION_BASE_URL: https://storage.googleapis.com/tnc-pharmacy-ocr-bucket-dev/
          NEXT_PUBLIC_DEPLOY_ENV: ci
        run: npm run build
